server {
  listen 80;
  server_name _;

  # Discovery uploads arrive in 8 MB chunks, but leave headroom rather than
  # having nginx reject a chunk the application would have accepted.
  client_max_body_size 64m;

  # A large corpus takes a while to preview and commit.
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  # Same origin for the API. Session renewal and chunked upload both assume it.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # stream chunks rather than spooling them
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;   # single-page app
  }
}
