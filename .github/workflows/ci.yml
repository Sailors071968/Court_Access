# ============================================
# Court Access — CI Pipeline
# Phase 119: Production Hardening
#
# Triggers on:
# - Pull requests
# - Push to dev branch
#
# Steps:
# 1. Install dependencies
# 2. TypeScript typecheck
# 3. ESLint
# 4. Unit tests (Vitest)
# 5. Integration tests
# ============================================

name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [dev]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --reporter=verbose

      - name: Run unit tests with coverage
        run: npx vitest run --coverage --reporter=verbose
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.ts --reporter=verbose
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          REDIS_URL: ''

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build
