# ===========================================================================
# CourtAccess — NGINX Production Configuration
# Architecture:
#   /api/*  → Backend API (Fastify on port 3001)
#   /*      → Frontend static files (served from dist/)
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/courtaccess
#   sudo ln -sf /etc/nginx/sites-available/courtaccess /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: Update 'root' path below to match your deployment directory.
# ===========================================================================

server {
    listen 80;
    server_name courtaccess.net www.courtaccess.net;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Evidence file uploads (up to 500 MB) ---
    client_max_body_size 500M;

    # --- API → Backend (port 3001) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Long-running analysis endpoints
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Frontend → Static files from dist/ ---
    root /var/www/courtaccess/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache static assets ---
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

