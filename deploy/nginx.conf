# ===========================================================================
# CourtAccess — Production NGINX Configuration
# Merged from live server config + deployment enhancements
#
# Architecture:
#   /api/*  → Backend API (currently Express on port 3000, Fastify on 3001 after Stage 1)
#   /*      → Frontend static files from /var/www/courtaccess/dist/
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: This replaces the server block inside your existing nginx.conf.
#       Preserve any top-level directives (worker_processes, events {}, etc.)
#       that exist above the http {} block.
# ===========================================================================

server {
    server_name courtaccess.net www.courtaccess.net;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Evidence file uploads (up to 500 MB) ---
    client_max_body_size 500M;

    # --- API → Backend ---
    # Stage 0: proxy to Express bootstrap on port 3000
    # Stage 1: change to port 3001 when Fastify replaces Express
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;

        # Long-running analysis endpoints (5 min timeout)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Frontend → Static files from dist/ ---
    root /var/www/courtaccess/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache hashed assets (30 days, immutable) ---
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- SSL (managed by Certbot) ---
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/courtaccess.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courtaccess.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- HTTP → HTTPS redirect (managed by Certbot) ---
server {
    if ($host = www.courtaccess.net) {
        return 301 https://$host$request_uri;
    }

    if ($host = courtaccess.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name courtaccess.net www.courtaccess.net;
    return 404;
}
