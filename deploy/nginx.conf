# ===========================================================================
# CourtAccess — Production NGINX Configuration (Stage 1 Hardened)
#
# Architecture:
#   /api/*  → Backend API (Fastify on port 3001)
#   /*      → Frontend static files from /var/www/courtaccess/dist/
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Rollback:
#   sudo cp /etc/nginx/nginx.conf.pre-stage1 /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Validate:
#   curl -sI https://courtaccess.net | grep -iE 'content-security|x-frame|strict-transport|x-content|gzip'
#   curl -sI https://courtaccess.net/api/health
#
# NOTE: This replaces the server block inside your existing nginx.conf.
#       Preserve any top-level directives (worker_processes, events {}, etc.)
#       that exist above the http {} block.
# ===========================================================================

# --- Rate limiting zones (define in http {} block, before server {}) ---
# limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=api_upload:10m rate=2r/s;

server {
    server_name courtaccess.net www.courtaccess.net;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Remove server identification
    server_tokens off;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # --- Evidence file uploads (up to 500 MB) ---
    client_max_body_size 500M;

    # --- API → Backend (Fastify on port 3001) ---
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;    # Long-running analysis endpoints
        proxy_send_timeout 300s;

        # Buffering for large responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Rate limiting (uncomment after adding zone definitions to http {} block)
        # limit_req zone=api_general burst=50 nodelay;
    }

    # --- Auth API rate limiting (stricter) ---
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Rate limiting for auth (uncomment after adding zone definitions)
        # limit_req zone=api_auth burst=10 nodelay;
    }

    # --- Evidence upload endpoint (separate limits) ---
    location ^~ /api/evidence/upload {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;    # 10 min for large file uploads
        proxy_send_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;

        # Rate limiting for uploads (uncomment after adding zone definitions)
        # limit_req zone=api_upload burst=5 nodelay;
    }

    # --- Health check (no rate limit, no logging) ---
    location = /api/health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Frontend → Static files from dist/ ---
    root /var/www/courtaccess/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache hashed assets (30 days, immutable) ---
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Deny access to hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- SSL (managed by Certbot) ---
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/courtaccess.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courtaccess.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- HTTP → HTTPS redirect (managed by Certbot) ---
server {
    if ($host = www.courtaccess.net) {
        return 301 https://$host$request_uri;
    }

    if ($host = courtaccess.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name courtaccess.net www.courtaccess.net;
    return 404;
}
