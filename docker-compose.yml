# ============================================
# Court Access — Docker Compose
# Phase 35: Beta Deployment
#
# Services:
# - api: Main backend API server + BullMQ worker
# - postgres: PostgreSQL database (Prisma)
# - redis: Redis for BullMQ job queue
# - clamav: ClamAV antivirus daemon
# ============================================

version: '3.8'

services:
  # ----- Backend API + Worker -----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      # Secrets — pass via .env file or CI/CD
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-court-access-evidence}
      - SENTRY_DSN=${SENTRY_DSN}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5174}
      - DATABASE_URL=${DATABASE_URL:-postgresql://courtaccess:courtaccess@postgres:5432/courtaccess}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - ADMIN_ALERT_PHONE=${ADMIN_ALERT_PHONE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----- PostgreSQL (Prisma) -----
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=courtaccess
      - POSTGRES_PASSWORD=courtaccess
      - POSTGRES_DB=courtaccess
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U courtaccess']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Redis (BullMQ) -----
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- ClamAV Antivirus -----
  clamav:
    image: clamav/clamav:stable
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'clamdcheck']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres-data:
  redis-data:
  clamav-data:
